server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Arquivos estáticos com hash no nome (gerados pelo Vite) podem
    # ser cacheados de forma agressiva.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy da API para o container do backend (nome do serviço no
    # docker-compose.yml). Assim o frontend só precisa conhecer /api,
    # sem se preocupar com host/porta do backend nem com CORS.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota que não seja um arquivo existente cai no
    # index.html, deixando o react-router-dom cuidar do roteamento.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
